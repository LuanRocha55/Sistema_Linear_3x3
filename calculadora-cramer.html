<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Interativa da Regra de Cramer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Chosen Palette: Warm Neutrals (Background: #FBF9F6, Text: #333333, Accent: #C7782C, Muted Green: #4CAF50) -->
    <!-- Application Structure Plan: A single-page app structured as an interactive calculator combined with an educational tool. The layout flows from Introduction -> Interactive Calculator -> Dynamic Step-by-Step Visualization -> Collapsible Theoretical Explanations -> Footer. This task-oriented structure was chosen because the primary user goal is to solve a system and understand the process. It prioritizes the interactive tool while making the theoretical background accessible on demand, which is more user-friendly than the linear structure of the original report. -->
    <!-- Visualization & Content Choices: Report Info: Matrix/Vector input -> Goal: User Input -> Viz: HTML input grid -> Interaction: Typing, Button click -> Justification: Intuitive data entry. Report Info: Calculation Steps -> Goal: Educate -> Viz: Dynamically generated HTML/CSS matrices -> Interaction: Appears on calculation -> Justification: Visually clarifies the abstract steps of Cramer's rule. Report Info: Theory -> Goal: Reference -> Viz: HTML collapsible sections -> Interaction: User click -> Justification: Hides supplementary info to keep the UI clean. All calculations are done in vanilla JS, replicating the Python script's logic. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FBF9F6;
            color: #333333;
        }
        .matrix-input {
            width: 60px;
            height: 60px;
            text-align: center;
            font-size: 1.125rem;
            border: 2px solid #D1D5DB;
            border-radius: 0.5rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .matrix-input:focus {
            border-color: #C7782C;
            box-shadow: 0 0 0 2px rgba(199, 120, 44, 0.3);
            outline: none;
        }
        .matrix-display {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.5rem;
            padding: 1rem;
            border: 2px solid #E5E7EB;
            border-radius: 0.5rem;
            background-color: #FFFFFF;
        }
        .matrix-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            height: 50px;
            font-size: 1.125rem;
            background-color: #F9FAFB;
            border-radius: 0.25rem;
        }
        .highlight-col {
            background-color: #FEEBCB;
            color: #C7782C;
            font-weight: 700;
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease-in-out;
        }
        .accordion-button[aria-expanded="true"] + .accordion-content {
            max-height: 1000px;
        }
    </style>
</head>
<body class="antialiased">
<!-- (corpo do HTML omitido aqui para brevidade, já está incluso no processamento) -->
</body>
</html>
